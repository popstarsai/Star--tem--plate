[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "star-tem-plate"
version = "0.1.0"
description = "Composable workflow discovery for agents and developers"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["mcp>=2,<3"]

[project.scripts]
star-plate = "star_template.cli:main"
star-plate-mcp = "star_template.server:main"

[tool.setuptools.packages.find]
where = ["src"]
